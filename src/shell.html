<meta property="og:type" content="website">
<meta name="theme-color" content="#0a100e">

<meta name="apple-mobile-web-app-title" content="HO’s Casino">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a100e'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23dcb05a'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">

<body>
<div id="splash">
  <div class="sp-suits" aria-hidden="true"><i>♠</i><i>♥</i><i>♦</i><i>♣</i><i>♠</i><i>♦</i></div>
  <div class="sp-crest" aria-hidden="true">♠</div>
  <h1 class="sp-title"><span class="ho">HO’s</span><span class="ca">CASINO</span></h1>
  <p class="sp-sub">친구들과 함께하는 카드 게임 라운지</p>
  <button class="sp-start" id="startBtn">START</button>
  <p class="sp-foot">홀덤 · 블랙잭 · 룰렛 · 바카라 · 섯다 · 술래잡기</p>
</div>
<div id="lobby" hidden>
  <header class="top"><div class="brand"><span class="mark" aria-hidden="true">♠</span><b>HO’s Casino</b></div><div class="meta">로비</div></header>
  <div id="lobbyBody"></div>
</div>
<div id="gapp" hidden>
  <header class="top">
    <button class="icon-btn" id="gBack" aria-label="로비로 나가기">‹</button>
    <div class="brand"><b id="gTitle"></b></div>
    <button class="roomchip" id="gCode" aria-label="방 코드 · 친구 초대"></button>
    <div class="meta"></div>
    <div class="online" id="gOnline" hidden title="지금 접속 중"><i></i><span id="gOnlineN">0</span>명</div>
    <button class="icon-btn" id="gMenu" aria-label="메뉴">☰</button>
  </header>
  <div class="banner" id="gBanner" hidden><span></span><button hidden></button></div>
  <main id="gStage" class="gstage"></main>
  <section class="dock" id="gDock"></section>
</div>
<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">♠</span><b>HO’s Casino</b></div>
    <div class="meta" id="meta"></div>
    <div class="online" id="online" hidden title="지금 접속 중"><i></i><span id="onlineN">0</span>명</div>
    <button class="icon-btn" id="menuBtn" aria-label="테이블 메뉴">☰</button>
  </header>
  <div class="banner" id="banner" hidden><span id="bannerText"></span><button id="bannerBtn" hidden></button></div>
  <main id="tableWrap">
    <div id="table">
      <div class="felt" id="felt"></div>
      <div class="center" id="center">
        <div class="pot" id="pot"></div>
        <div class="board" id="board"></div>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      <div id="bets"></div>
      <div id="seats"></div>
    </div>
  </main>
  <section class="dock" id="dock"></section>
</div>
<div class="backdrop" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-label="테이블 메뉴"></div></div>
<div class="backdrop center-modal" id="modalBack" hidden><div class="modal" id="modal" role="dialog"></div></div>
<div class="toast" id="toast" hidden role="status"></div>
